# ===========================================================================
# DINOv3 ViT-S/16 pretraining on ImageNet-1k  --  Daint (4x GH200) variant
#   * 4 register tokens, SLOT-REGISTER competition attention
#   * registers never attend to other registers; register->patch logits are
#     softmaxed across the register dimension (competition), key-renormalized
#   * CLS/patch attention is STANDARD (no separate register budget) -- this is
#     the "pure slot" ablation; see _budget variants for separate budgets
#   * effective batch 512 = 128 per GPU x 4 GPUs, 200k steps
#
# Merged on top of dinov3/configs/ssl_default_config.yaml.
# Launch:  register_project/daint/sbatch_train.sh (sbatch wrapper)
# ===========================================================================
MODEL:
  META_ARCHITECTURE: SSLMetaArch

train:
  # Effective batch 512 = 128 per GPU x 4 GH200 GPUs (no grad accum).
  batch_size_per_gpu: 128
  grad_accum_steps: 1
  dataset_path: ImageNetPacked:split=TRAIN:root=/capstor/scratch/cscs/fbombass/datasets/imagenet1k_packed
  num_workers: 32
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  dataloader_multiprocessing_context: forkserver
  normalize_on_gpu: true
  compile: true
  OFFICIAL_EPOCH_LENGTH: 1          # overwritten by the step-based schedule normalizer
  wandb:
    enabled: true
    project: dinov3-slot-registers
    name: vits-reg4-slot
    tags: [vits, reg4, slot, slot-attn, daint]
    log_freq: 10

student:
  arch: vit_small
  patch_size: 16
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  n_storage_tokens: 4               # 4 register / slot tokens
  register_attn_type: slot          # slot-register competition attention
  slot_mode: slot                   # key-renormalized weighted mean
  register_attn_exclude_cls: true   # registers compete over patch tokens only
  patch_cls_attn_type: standard     # CLS/patch attention exactly as baseline
  register_init: learned            # fixed learned register params

crops:
  global_crops_size: 256            # 16x16 = 256 patch tokens
  local_crops_size: 112             # 7x7 = 49 patch tokens

schedule:
  enabled: true
  total_steps: 200000
  warmup_steps: 10000
  freeze_last_layer_steps: 1000
  teacher_temp_warmup_steps: 30000

optim:
  scaling_rule: sqrt_wrt_1024

evaluation:
  eval_period_iterations: 0
  simple:
    enabled: true
    knn:
      enabled: true
      period_steps: 25000
      train_dataset: ImageNetPacked:split=TRAIN:root=/capstor/scratch/cscs/fbombass/datasets/imagenet1k_packed
      val_dataset: ImageNetPacked:split=VAL:root=/capstor/scratch/cscs/fbombass/datasets/imagenet1k_packed
      image_size: 256
      full_at_end: true
      full_max_train_images: null
      full_max_val_images: null
    linear:
      enabled: true
      period_steps: 25000
      train_dataset: ImageNetPacked:split=TRAIN:root=/capstor/scratch/cscs/fbombass/datasets/imagenet1k_packed
      val_dataset: ImageNetPacked:split=VAL:root=/capstor/scratch/cscs/fbombass/datasets/imagenet1k_packed
      image_size: 256
      max_train_images: 150000
      max_val_images: 25000
      batch_size: 256
      probe_batch_size: 8192
      epochs: 20
    coco_linear_segmentation:
      enabled: true
      period_steps: 25000
      coco_root: /capstor/scratch/cscs/fbombass/datasets/coco
      train_split: train2017
      val_split: val2017
      image_size: 256
      max_train_images: 8000
      max_val_images: 2000
      batch_size: 64
      epochs: 10

checkpointing:
  period: 2500                      # latest checkpoint every 2500 steps
  max_to_keep: 3
  keep_every: 25000                 # milestone checkpoints kept forever
  wandb_upload: true                # ... and uploaded to wandb as artifacts

register_diagnostics:
  enabled: true
  every_n_steps: 500
  num_images: 32
  image_size: 256
  outlier_ratio: 2.0
  crop_pairs: true

register_viz:
  enabled: true
  every_n_steps: 25000
  num_images: 16
  coco_num_images: 6
  layer: -1
  dataset: ImageNetPacked:split=VAL:root=/capstor/scratch/cscs/fbombass/datasets/imagenet1k_packed
  image_size: 256

diffcut:
  enabled: true
  every_n_steps: 25000
  coco_root: /capstor/scratch/cscs/fbombass/datasets/coco
  split: val2017
  max_images: 1000
  resolutions: [256, 1024]
  tau: 0.5
  alpha: 10

mbo:
  enabled: true
  every_n_steps: 25000
  coco_root: /capstor/scratch/cscs/fbombass/datasets/coco
  split: val2017
  max_images: 2000
  layer: -1
  image_size: 256
  instance: true
  semantic: true
