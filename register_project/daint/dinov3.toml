# Container Engine EDF for DINOv3 register-tokens training on Daint (GH200).
# Install at ~/.edf/dinov3.toml on the cluster.
image = "nvcr.io#nvidia/pytorch:25.06-py3"
writable = true
mounts = [
    "/capstor/scratch/cscs/fbombass:/capstor/scratch/cscs/fbombass",
    "/users/fbombass:/users/fbombass",
]
workdir = "/capstor/scratch/cscs/fbombass/dinov3"
