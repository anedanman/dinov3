MODEL:
  META_ARCHITECTURE: SSLMetaArch
  DEVICE: cuda
  WEIGHTS: ''
  DTYPE: float32
compute_precision:
  param_dtype: bf16
  reduce_dtype: fp32
  sharding_strategy: SHARD_GRAD_OP
dino:
  loss_weight: 1.0
  global_ignore_diagonal: true  # Whether to ignore A-A and B-B global pairs, default as in DINOv2, ignored by SSLMetaArch
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1
  koleo_loss_distributed: false
  koleo_topk: 1
  koleo_distributed_replicas: 0
  koleo_distributed_loss_group_size: null  # Size of the nearest neighbor set for distributed Koleo. If None, uses global batch size.
  koleo_distributed_loss_group_data: true # group data from adjacent ranks to make sure koleo is applied on the same data distribution
  force_weight_norm: false
  reweight_dino_local_loss: false # If true, reweighting of DINO loss
  local_loss_weight_schedule:  # Schedule for local loss weight, enabled if reweight_dino_local_loss is true
    start: 0.5
    peak: 0.5
    end: 0.5
    warmup_epochs: 0
ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max:
  - 0.1
  - 0.5
  mask_random_circular_shift: false
  force_masking_even_with_zero_weight: False
  separate_head: true
  head_n_prototypes: 65536
  head_bottleneck_dim: 256
  head_norm_last_layer: false
  head_nlayers: 3
  head_hidden_dim: 2048
gram:
  use_loss: false # (bool) if true gram is used, else not
  compute_stats: false # (bool): if true compute auxilliary stats
  loss_weight: 1.0 # (float): weight of the loss
  ema_teacher: false # (bool): using the EMA teacher as GRAM teacher
  ckpt: null  #(str): Checkpoint to the teacher
  it_load_ema_teacher: -1 # (int): iteration at which the ema teacher is loaded into the gram teacher
  rep_update: true # (bool): if true GRAM teacher updated every gram.update_frequency after iter gram.it_first_update steps
  update_frequency: 50000 # (int): update frequency
  it_first_update: 0 # (int): iteration of the first update
  max_updates: null # (int): maximum number of updates to gram teacher. If None, it is unlimited
  normalized: true # (bool): normalization of the features
  img_level: false # (bool): if true GRAM computation at the image else, otherwise at the local batch level
  remove_neg: false # (bool): if true remove the negative similarities before applying the loss
  remove_only_teacher_neg: false # (bool): remove negative similarities of the teacher
  tokens_used: all # (str): In [all, masked, unmasked]
  global_teacher_resize_method: bicubic  # Method for resizing the outputs of the gram teacher
  global_teacher_resize_antialias: false  # Whether to use antialiasing when resizing the outputs of the gram teacher
  loss_weight_schedule: null  # (dict): If not None, use a schedule for the loss weight instead of `loss_weight`
train:
  batch_size_per_gpu: 64
  grad_accum_steps: 1  # number of micro-batches accumulated per optimizer step; effective batch = batch_size_per_gpu * world_size * grad_accum_steps
  dataset_path: ImageNet:split=TRAIN
  data_config: null
  output_dir: .
  saveckp_freq: 20
  seed: 0
  num_workers: 10
  pin_memory: true
  prefetch_factor: null
  persistent_workers: false
  dataloader_multiprocessing_context: null
  normalize_on_gpu: false  # ship uint8 crops from the loader and scale/normalize on the GPU (4x less host-RAM batch traffic)
  OFFICIAL_EPOCH_LENGTH: 1250
  monitor_gradient_norm: false
  chunk_schedule: []
  use_teacher_head: true
  learn_from_teacher_tokens: false
  centering: "sinkhorn_knopp" # or "sinkhorn_knopp"
  checkpointing: false
  checkpointing_full: false  # aggressive checkpointing
  compile: true
  cudagraphs: false
  empty_cuda_cache_after_eval: false
  sharded_eval_checkpoint: false
  cache_dataset: false
  wandb:
    enabled: false
    project: dinov3-registers
    entity: null
    name: null  # run name; defaults to output_dir basename
    group: null
    tags: []
    mode: online  # online | offline | disabled
    log_freq: 10  # log scalar metrics every N steps
student:
  arch: vit_large
  patch_size: 16
  drop_path_rate: 0.3
  layerscale: 1.0e-05
  pretrained_weights: ''
  ffn_layer: "mlp"
  ffn_ratio: 4.0
  resume_from_teacher_chkpt: ""
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  norm_layer: "layernorm"
  n_storage_tokens: 0
  register_attn_type: standard  # "standard" or "slot" (slot-register competition attention)
  slot_mode: slot  # "slot" (key-renormalized weighted mean) or "literal" (out = A @ v); only used when register_attn_type=slot
  register_attn_exclude_cls: true  # For slot attention, registers compete over patches only by default.
  patch_cls_attn_type: standard  # "standard" or "separate_register_budget" (CLS/patch rows softmax separately over cls+patch keys and register keys)
  slot_start_layer: 0  # first block index using slot competition for register rows; earlier blocks fall back to standard register rows (keeping patch_cls_attn_type). 0 = all layers.
  register_budget_gate: false  # learnable per-head, per-layer multiplier on the separate register budget (init 1 = ungated); requires patch_cls_attn_type=separate_register_budget
  register_init: learned  # "learned" fixed register params, or "gaussian" sampled from shared Xavier-initialized mean/log-std params.
  register_gaussian_std_init: 0.02  # legacy compatibility field; gaussian init mirrors masked_ocl and does not use this value.
  register_orthogonalize: false  # symmetric (Loewdin) orthogonalization of register tokens after every block: Y = (XX^T + eps I)^{-1/2} X
  register_orth_eps: 1.0e-06  # relative ridge (times the mean Gram diagonal); must stay below the residual eigenvalue fraction or collapsed registers get annihilated instead of orthogonalized
  register_orth_preserve_norm: true  # rescale each orthogonalized register back to its pre-orthogonalization norm
  mask_k_bias: false
  untie_cls_and_patch_norms: false  # If true, use separate norms for CLS/reg and patch/mask tokens
  untie_global_and_local_cls_norm: false  # If true, use separate norms for local and global crop CLS token during training
  in_chans: 3
  pos_embed_type: rope
  pos_embed_rope_base: 100.0
  pos_embed_rope_min_period: null
  pos_embed_rope_max_period: null
  pos_embed_rope_normalize_coords: separate  # min, max, separate
  pos_embed_rope_shift_coords: null
  pos_embed_rope_jitter_coords: null
  pos_embed_rope_rescale_coords: null
  pos_embed_rope_dtype: bf16
  fp8_enabled: False  # Convert Linear layers to operate in fp8 precision
  fp8_filter: "blocks"  # Regex that must appear in module path; empty means everything
teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 30
  in_chans: 3
distillation:  # teacher
  enabled: false
  full_cfg_path: ""
  checkpoint_path: ""
multidistillation:
  enabled: false
hrft:  # non-hrft'd student
  enabled: false
  checkpoint_path: ""  # teacher_checkpoint path
optim:
  epochs: 100
  optimizer: adamw
  weight_decay: 0.04
  weight_decay_end: 0.4
  lr: 0.001
  warmup_epochs: 10
  min_lr: 1.0e-06
  schedule_trunc_extra: 0.0  # Compute the schedule for (1 + schedule_trunc_extra) steps and truncate, .25 is a good choice
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  dino_head_wd_multiplier: 1.0
  layerwise_decay: 0.9
  multi_tensor_optim: true
  dump_fsdp_weights_path: ""
  adamw_beta1: 0.9
  adamw_beta2: 0.999
# Step-based scheduling. When `enabled`, training length and all warmups are
# expressed directly in optimizer steps (not epochs). This is mapped onto the
# epoch-based machinery by setting train.OFFICIAL_EPOCH_LENGTH = 1.
schedule:
  enabled: false
  total_steps: 100000
  warmup_steps: 5000
  freeze_last_layer_steps: 1250
  teacher_temp_warmup_steps: 18750
crops:
  global_crops_scale:
  - 0.32
  - 1.0
  local_crops_number: 8
  local_crops_scale:
  - 0.05
  - 0.32
  global_crops_size: 224
  local_crops_size: 96
  global_local_crop_pairs_ratios: 1.0
  gram_teacher_crops_size: null  # If not None, return crops for gram teacher
  localcrops_subset_of_globalcrops: false
  share_color_jitter: false
  horizontal_flips: true
  gram_teacher_no_distortions: false  # If True, no distortions are applied to gram teacher crops
  rgb_mean:
  - 0.485
  - 0.456
  - 0.406
  rgb_std:
  - 0.229
  - 0.224
  - 0.225
  teacher_to_student_resolution_scale: 1.0
evaluation:
  eval_period_iterations: 12500
  low_freq_every: 5
  config_files:  # Must be in fairvit/eval/configs
    high_freq: benchmark_high_frequency.yaml  # More often
    low_freq: benchmark_low_frequency.yaml  # Less often
  simple:
    enabled: false
    knn:
      enabled: false
      period_steps: 10000
      train_dataset: null  # null = train.dataset_path
      val_dataset: null  # null = train dataset with split=VAL
      image_size: 256
      max_train_images: 40000
      max_val_images: 10000
      full_at_end: false
      full_max_train_images: null  # null = full train split
      full_max_val_images: null  # null = full val split
      batch_size: 128
      num_workers: 4
      k: 20
      temperature: 0.07
      avg_register: true  # also run KNN on mean-pooled register-token features, when registers exist
      seed: 0
    linear:
      enabled: false
      period_steps: 50000
      train_dataset: null
      val_dataset: null
      image_size: 256
      max_train_images: 50000
      max_val_images: 10000
      batch_size: 128
      num_workers: 4
      probe_batch_size: 4096
      epochs: 10
      lr: 0.01
      weight_decay: 0.0
      seed: 1
    coco_linear_segmentation:
      enabled: false
      period_steps: 50000
      coco_root: ~/datasets/coco
      train_split: train2017
      val_split: val2017
      image_size: 256
      max_train_images: 2000
      max_val_images: 500
      batch_size: 32
      num_workers: 4
      epochs: 3
      probe_batch_size: 16384  # patches per head-training step (features are cached, epochs are cheap)
      lr: 0.001
      weight_decay: 0.0
      seed: 2
checkpointing:
  period: 3750
  max_to_keep: 3
  keep_every: 99999999999999999  # Save a checkpoint every N iterations, regardless of max_to_keep and period
  wandb_upload: false  # upload each keep_every milestone checkpoint to wandb as an artifact

# ---------------------------------------------------------------------------
# Register-token research extensions (used by dinov3/eval/register_tokens)
# ---------------------------------------------------------------------------
register_consistency:
  enabled: false            # cross-crop register consistency loss (student crop A registers vs teacher crop B registers)
  loss_weight: 0.1          # weight of the mean (1 - cosine) over matched register pairs
  matching: hungarian       # "hungarian" (per-image optimal permutation) or "fixed" (index-aligned registers)
  include_local: false      # also pull student local-crop registers toward teacher global-crop registers
  warmup_steps: 0           # linear ramp of the loss weight over this many steps (0 = constant)
  subtract_mean: false      # match mean-subtracted register residuals (raw cosines saturate once registers share a dominant direction)

register_diagnostics:
  enabled: false            # cheap quantitative register/outlier diagnostics on a fixed image batch
  every_n_steps: 500
  num_images: 32            # fixed deterministic batch from `register_viz.dataset`
  image_size: 256
  outlier_ratio: 2.0        # patch-norm outlier threshold, as a multiple of the per-image median norm
  crop_pairs: true          # also measure cross-crop register agreement on two fixed views per image

register_viz:
  enabled: false
  every_n_steps: 2500       # render register-attention overlays every N steps
  num_images: 8             # number of validation images to visualize
  layer: -1                 # which block's register attention to read (-1 = last)
  dataset: ImageNetPacked:split=VAL:root=~/datasets/imagenet1k_packed  # source of viz images
  image_size: 224
  coco: true                # also render COCO validation panels for MBO variants
  coco_num_images: null     # null = reuse num_images
  patch_pca: true                 # PCA-RGB patch-feature panels (joint, bg-removed, per-image)
  patch_pca_num_images: 16        # dedicated image set for the PCA panels
  patch_pca_hires_size: 1024      # render the same image set again at this resolution (0 = off)

diffcut:
  enabled: false
  every_n_steps: 25000      # DiffCut zero-shot segmentation eval cadence
  coco_root: ~/datasets/coco
  split: val2017
  max_images: 100           # eigendecompositions per image make this pricier than linear probes
  resolutions: [256, 1024]  # input resolutions; metrics are logged per resolution
  tau: 0.5                  # recurse while the best normalized-cut value is below tau
  alpha: 10                 # affinity sharpening exponent on min-max-normalized cosine similarity
  max_graph_nodes: 1024     # avg-pool the NCut graph down to at most this many patches
  batch_size: 16            # feature-extraction batch at 256px (scaled down at higher resolutions)
  viz_num_images: 10        # fixed COCO images rendered as colored segmentation panels
  viz_display_size: 512     # display resolution of the segmentation panels

mbo:
  enabled: false
  every_n_steps: 5000       # compute COCO MBO every N steps
  coco_root: ~/datasets/coco
  split: val2017
  max_images: 2000          # cap for speed; null = all val images
  image_size: 224
  layer: -1
  upsample: bilinear        # how to upsample register attention to image resolution
  semantic: true            # compute semantic MBO (panoptic stuff+things merged by category)
  instance: true            # compute instance MBO (per-object masks)
  # Validation reports register2patch and patch2register masks for:
  # last, penultimate, all-layer average, second-half-layer average, and
  # last-layer per-head masks.

